<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kral Chat | Odalı Sohbet</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; display: flex; height: 95vh; box-sizing: border-box; gap: 20px; }
        
        /* Sol Oda Listesi Paneli */
        .sol-panel { width: 220px; background-color: #242424; border: 1px solid #333; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .sol-panel h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #404040; padding-bottom: 8px; font-size: 16px; }
        .oda-listesi { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .oda-butonu { background-color: #2d2d2d; color: #e0e0e0; border: 1px solid #404040; padding: 8px 12px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 14px; transition: all 0.2s; }
        .oda-butonu:hover { background-color: #3d3d3d; border-color: #10b981; }
        .oda-butonu.aktif { background-color: #10b981; color: white; border-color: #10b981; font-weight: bold; }

        /* Sağ Sohbet Alanı Paneli */
        .ana-panel { flex-grow: 1; display: flex; flex-direction: column; }
        .durum-bilgisi { background-color: #2d2d2d; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #10b981; }
        #aktif-oda { font-weight: bold; color: #10b981; }
        .kontrol-paneli { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { background-color: #2d2d2d; border: 1px solid #404040; color: #ffffff; padding: 10px 15px; border-radius: 6px; outline: none; }
        #oda-input { flex-grow: 2; }
        #username-input { flex-grow: 1; font-weight: bold; color: #10b981; width: 80px; }
        button.ana-btn { background-color: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.ana-btn:hover { background-color: #059669; }
        #chat-penceresi { flex-grow: 1; background-color: #242424; border: 1px solid #333; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
        .mesaj { margin-bottom: 10px; font-size: 15px; }
        .mesaj strong { color: #34d399; margin-right: 5px; }
        .sistem-mesaji { color: #9ca3af; font-style: italic; background-color: rgba(16, 185, 129, 0.1); padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .mesaj-paneli { display: flex; gap: 10px; }
        #mesaj-input { flex-grow: 1; padding: 12px 15px; }
        #gonder-btn { background-color: #2563eb; color: white; border: none; border-radius: 6px; padding: 0 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- SOL PANEL: Odaların Listelendiği Yer -->
    <div class="sol-panel">
        <h3>💬 Aktif Odalar</h3>
        <div id="oda-listesi-alanı" class="oda-listesi">
            <!-- Açılan odalar buraya otomatik eklenecek -->
        </div>
    </div>

    <!-- SAĞ PANEL: Sohbet Alanı -->
    <div class="ana-panel">
        <div class="durum-bilgisi">
            Şu anki Oda: <span id="aktif-oda">Genel</span>
        </div>

        <div class="kontrol-paneli">
            <input type="text" id="username-input" value="Kral">
            <input type="text" id="oda-input" placeholder="Yeni oda adı yazın...">
            <button class="ana-btn" onclick="odaOlustur()">Oda Aç</button>
        </div>

        <div id="chat-penceresi"></div>

        <div class="mesaj-paneli">
            <input type="text" id="mesaj-input" placeholder="Mesajınızı yazın..." autocomplete="off">
            <button id="gonder-btn" onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        let mevcutOda = 'Genel';
        // Sitenizde kalıcı olması veya görünmesi için oluşturulan odaları tutan liste
        let acikOdalar = ['Genel']; 

        function odayaKatil(odaAdi) {
            mevcutOda = odaAdi;
            document.getElementById('aktif-oda').innerText = mevcutOda;
            document.getElementById('chat-penceresi').innerHTML = '';
            
            // Sistem mesajı basıyoruz
            const p = document.createElement('div');
            p.className = 'mesaj';
            p.innerHTML = `<span class="sistem-mesaji">⚙️ "${mevcutOda}" odasına geçiş yaptınız.</span>`;
            document.getElementById('chat-penceresi').appendChild(p);

            // Sol listedeki aktif buton görselini güncelle
            odaListesiniGuncelle();
        }

        function odaOlustur() {
            const odaInput = document.getElementById('oda-input');
            if (odaInput && odaInput.value.trim() !== '') {
                let yeniOdaAdi = '#' + odaInput.value.trim().replace('#', '');
                
                // Eğer oda listede yoksa listeye ekle
                if (!acikOdalar.includes(yeniOdaAdi)) {
                    acikOdalar.push(yeniOdaAdi);
                }
                
                odayaKatil(yeniOdaAdi);
                odaInput.value = '';
            }
        }

        function odaListesiniGuncelle() {
            const listeAlani = document.getElementById('oda-listesi-alanı');
            listeAlani.innerHTML = '';

            acikOdalar.forEach(oda => {
                const btn = document.createElement('button');
                btn.className = 'oda-butonu';
                if(oda === mevcutOda) btn.className += ' aktif';
                btn.innerText = oda;
                // Listeden odaya tıklayınca doğrudan geçiş yapma özelliği
                btn.onclick = function() { odayaKatil(oda); };
                listeAlani.appendChild(btn);
            });
        }

        function mesajGonder() {
            const input = document.getElementById('mesaj-input');
            const username = document.getElementById('username-input').value || 'Kral';
            if (input.value.trim() === '') return;

            const p = document.createElement('div');
            p.className = 'mesaj';
            p.innerHTML = `<strong>[${username}]:</strong> ${input.value}`;
            
            const pencere = document.getElementById('chat-penceresi');
            pencere.appendChild(p);
            pencere.scrollTop = pencere.scrollHeight;
            input.value = '';
        }

        document.getElementById('mesaj-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') mesajGonder();
        });

        // Sayfa yüklendiğinde listeyi hazırla ve Genel odasını aç
        window.onload = function() {
            odayaKatil('Genel');
        };
    </script>
</body>
</html>
