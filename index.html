<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kral Chat | Bot Destekli</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; display: flex; height: 95vh; box-sizing: border-box; gap: 20px; }
        .sol-panel { width: 220px; background-color: #242424; border: 1px solid #333; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .sol-panel h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #404040; padding-bottom: 8px; font-size: 16px; }
        .oda-listesi { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .oda-butonu { background-color: #2d2d2d; color: #e0e0e0; border: 1px solid #404040; padding: 8px 12px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 14px; }
        .oda-butonu.aktif { background-color: #10b981; color: white; border-color: #10b981; font-weight: bold; }
        .ana-panel { flex-grow: 1; display: flex; flex-direction: column; }
        .durum-bilgisi { background-color: #2d2d2d; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #10b981; }
        #aktif-oda { font-weight: bold; color: #10b981; }
        .kontrol-paneli { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { background-color: #2d2d2d; border: 1px solid #404040; color: #ffffff; padding: 10px 15px; border-radius: 6px; outline: none; }
        #oda-input { flex-grow: 2; }
        #username-input { flex-grow: 1; font-weight: bold; color: #ef4444; width: 80px; text-align: center; }
        button.ana-btn { background-color: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #chat-penceresi { flex-grow: 1; background-color: #242424; border: 1px solid #333; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
        .mesaj { margin-bottom: 10px; font-size: 15px; }
        .mesaj strong { color: #34d399; margin-right: 5px; }
        .admin-mesaj { background-color: rgba(239, 68, 68, 0.1); padding: 6px 12px; border-radius: 6px; border-left: 3px solid #ef4444; color: #fff; }
        .admin-etiket { background-color: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; }
        .admin-isim { color: #fca5a5 !important; }
        
        /* Bot Mesaj Tasarımı */
        .bot-mesaj { background-color: rgba(59, 130, 246, 0.1); padding: 6px 12px; border-radius: 6px; border-left: 3px solid #3b82f6; color: #fff; }
        .bot-etiket { background-color: #2563eb; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; }
        .bot-isim { color: #93c5fd !important; }

        .sistem-mesaji { color: #9ca3af; font-style: italic; background-color: rgba(16, 185, 129, 0.1); padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .duyuru-mesaji { color: #fff; font-weight: bold; background-color: #2563eb; padding: 8px 15px; border-radius: 6px; text-align: center; margin: 10px 0; }
        .mesaj-paneli { display: flex; gap: 10px; }
        #mesaj-input { flex-grow: 1; padding: 12px 15px; }
        #gonder-btn { background-color: #2563eb; color: white; border: none; border-radius: 6px; padding: 0 20px; font-weight: bold; cursor: pointer; }
        #admin-btn { background-color: #eb2525; color: white; border: none; border-radius: 6px; padding: 0 15px; font-weight: bold; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <div class="sol-panel">
        <h3>💬 Aktif Odalar</h3>
        <div id="oda-listesi-alanı" class="oda-listesi"></div>
    </div>

    <div class="ana-panel">
        <div class="durum-bilgisi">
            Şu anki Oda: <span id="aktif-oda">Genel</span>
        </div>

        <div class="kontrol-paneli">
            <input type="text" id="username-input" value="Kral" oninput="adminKontrolü()">
            <input type="text" id="oda-input" placeholder="Yeni oda adı yazın...">
            <button class="ana-btn" onclick="odaOlustur()">Oda Aç</button>
        </div>

        <div id="chat-penceresi"></div>

        <div class="mesaj-paneli">
            <input type="text" id="mesaj-input" placeholder="Mesajınızı yazın..." autocomplete="off">
            <button id="admin-btn" onclick="duyuruGonder()">📢 Duyuru Yap</button>
            <button id="gonder-btn" onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        let mevcutOda = 'Genel';
        let acikOdalar = ['Genel']; 
        const ADMIN_RUMUZU = "Kral"; 
        
        // BOTUN ADI
        const BOT_ADI = "AsistanBot";

        function odayaKatil(odaAdi) {
            mevcutOda = odaAdi;
            document.getElementById('aktif-oda').innerText = mevcutOda;
            document.getElementById('chat-penceresi').innerHTML = '';
            
            const p = document.createElement('div');
            p.className = 'mesaj';
            p.innerHTML = `<span class="sistem-mesaji">⚙️ "${mevcutOda}" odasına geçiş yaptınız.</span>`;
            document.getElementById('chat-penceresi').appendChild(p);

            odaListesiniGuncelle();

            // 1. KARŞILAMA BOTU TETİKLEME (Odaya girince bot selam verir)
            setTimeout(() => {
                botMesajGonder(`Merhaba! **${mevcutOda}** odasına hoş geldiniz. Ben kanal asistanıyım. Yardım almak için mesaj kısmına **bot** yazabilirsiniz.`);
            }, 800);
        }

        // BOT MESAJ YAZMA FONKSİYONU
        function botMesajGonder(metin) {
            const p = document.createElement('div');
            p.className = 'mesaj bot-mesaj';
            p.innerHTML = `<span class="bot-etiket">BOT</span><strong class="bot-isim">[${BOT_ADI}]:</strong> ${metin}`;
            const pencere = document.getElementById('chat-penceresi');
            pencere.appendChild(p);
            pencere.scrollTop = pencere.scrollHeight;
        }

        // 2. CEVAP BOTU SİSTEMİ (Gelen kelimeleri analiz eder)
        function botCevapKontrol(kullaniciMesaji, kullaniciAdi) {
            if (kullaniciAdi === BOT_ADI) return; // Bot kendi mesajına cevap vermesin

            const mesaj = kullaniciMesaji.toLowerCase().trim();

            setTimeout(() => {
                if (mesaj === "sa" || mesaj === "selam" || mesaj === "merhaba") {
                    botMesajGonder(`Aleyküm Selam, hoş geldin @${kullaniciAdi}! Keyifli sohbetler.`);
                } 
                else if (mesaj === "nbr" || mesaj === "nasılsın" || mesaj === "nasilsin") {
                    botMesajGonder(`İyiyim, teşekkür ederim @${kullaniciAdi}. Sen nasılsın, her şey yolunda mı?`);
                } 
                else if (mesaj === "bot" || mesaj === "yardım") {
                    botMesajGonder(`🤖 Komutlarım: **sa**, **selam**, **nasılsın**. Ayrıca yeni odalar kurarak sitenin tadını çıkarabilirsiniz!`);
                }
            }, 600); // Gerçekçi görünmesi için yarım saniye sonra cevap verir
        }

        // 3. ZAMANLI BOT DUYURUSU (Her 60 saniyede bir otomatik kural hatırlatır)
        setInterval(() => {
            const duyurular = [
                "Lütfen sohbet odalarında saygılı olalım. Küfür ve argo yasaktır! 🛑",
                "Kendi özel odanızı açmak için yukarıdaki 'Oda Aç' kutusunu kullanabilirsiniz! 🌐",
                "Sitemize arkadaşlarınızı davet ederek sohbeti büyütebilirsiniz! 🎉"
            ];
            const rastgeleDuyuru = duyurular[Math.floor(Math.random() * duyurular.length)];
            botMesajGonder(`📢 Hatırlatma: ${rastgeleDuyuru}`);
        }, 60000); // 60000 milisaniye = 1 dakika


        // --- DİĞER ESKİ SİSTEM KODLARI ---
        function odaOlustur() {
            const odaInput = document.getElementById('oda-input');
            if (odaInput && odaInput.value.trim() !== '') {
                let yeniOdaAdi = '#' + odaInput.value.trim().replace('#', '');
                if (!acikOdalar.includes(yeniOdaAdi)) {
                    acikOdalar.push(yeniOdaAdi);
                }
                odayaKatil(yeniOdaAdi);
                odaInput.value = '';
            }
        }

        function odaListesiniGuncelle() {
            const listeAlani = document.getElementById('oda-listesi-alanı');
            listeAlani.innerHTML = '';
            acikOdalar.forEach(oda => {
                const btn = document.createElement('button');
                btn.className = 'oda-butonu';
                if(oda === mevcutOda) btn.className += ' aktif';
                btn.innerText = oda;
                btn.onclick = function() { odayaKatil(oda); };
                listeAlani.appendChild(btn);
            });
        }

        function adminKontrolü() {
            const usernameInput = document.getElementById('username-input');
            const adminBtn = document.getElementById('admin-btn');
            if (usernameInput.value.trim() === ADMIN_RUMUZU) {
                usernameInput.style.color = "#ef4444";
                adminBtn.style.display = "block";
            } else {
                usernameInput.style.color = "#34d399";
                adminBtn.style.display = "none";
            }
        }

        function mesajGonder() {
            const input = document.getElementById('mesaj-input');
            const username = document.getElementById('username-input').value || 'Misafir';
            if (input.value.trim() === '') return;

            const p = document.createElement('div');
            if (username === ADMIN_RUMUZU) {
                p.className = 'mesaj admin-mesaj';
                p.innerHTML = `<span class="admin-etiket">Kurucu</span><strong class="admin-isim">[${username}]:</strong> ${input.value}`;
            } else {
                p.className = 'mesaj';
